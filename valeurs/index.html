<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>scrollyFFADA2S — Valeurs</title>
  <!-- En ligne, AVANT les feuilles de style : couleur de fond appliquée dès
       le premier affichage, avant le chargement du CSS — évite le flash
       entre deux pages. Même blanc que le thème clair de cette page
       (--color-scene-bg, shared/css/variables.css). -->
  <style>html { background-color: #ffffff; }</style>
  <link rel="stylesheet" href="../shared/css/variables.css" />
  <link rel="stylesheet" href="../shared/css/headerControls.css" />
  <link rel="stylesheet" href="../shared/css/railParcours.css" />
  <link rel="stylesheet" href="./css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<!-- data-page : identifie la page pour les règles scopées du rail partagé
     (timeline.svg est chargé par scrolly, univers ET valeurs) — voir
     railParcours.css (perles noires masquées) et railParcours.js (ancrage
     de la plume par sa pointe). -->
<body data-theme="clair" data-page="valeurs">
  <div id="entete-controles"></div>

  <div id="graphic" class="zone-scene-valeurs"></div>

  <div id="rail-parcours" class="rail-parcours"></div>

  <script type="module">
    import { initI18n } from "../shared/js/i18n.js";
    import { initValeurs } from "./js/valeursAnimation.js";
    import { initHeaderControls, langueInitiale } from "../shared/js/headerControls.js";
    import { initProgression } from "../shared/js/progression.js";
    import { construireRailParcours, definirEtapeActive } from "../shared/js/railParcours.js";

    await initI18n(langueInitiale());
    initValeurs("#graphic");
    initHeaderControls(document.getElementById("entete-controles"));

    await initProgression();
    await construireRailParcours(document.getElementById("rail-parcours"), {
      pageCourante: "valeurs/index.html",
      onClicEtape: (etape) => {
        if (etape.page === "valeurs/index.html") return; // déjà ici
        window.location.href = "../" + etape.page;
      },
    });

    definirEtapeActive("valeurs");
    // Plus d'appel à initRailPlume()/deplacerPlume() depuis la Tranche B2 :
    // le curseur plume vit maintenant DANS timeline.svg (#curseur_plume),
    // révélé statique par construireRailParcours() — aucun déplacement
    // animé pour l'instant (Tranche B3, séparée, à venir).
  </script>
</body>
</html>
