<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>scrollyFFADA2S — test Tranche A</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://unpkg.com/flubber@0.3.0"></script>
  <link rel="stylesheet" href="../shared/css/variables.css">
  <link rel="stylesheet" href="./css/timeline.css">
  <link rel="stylesheet" href="../shared/css/headerControls.css">
  <link rel="stylesheet" href="../shared/css/railParcours.css">
  <style>
    /* Rail hérité (timelineRail.js) masqué visuellement mais gardé dans le
       DOM et toujours construit normalement — filet de sécurité. Retour en
       arrière = retirer cette seule ligne. */
    #zone-timeline { display: none; }

    #bouton-explorer-etoiles {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 0.9rem 2.2rem;
      font-family: sans-serif;
      font-size: 1rem;
      letter-spacing: 0.04em;
      color: #111;
      background-color: #eadd42; /* même jaune que les étoiles de step11 */
      border-radius: 4px;
      text-decoration: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.2s ease;
      z-index: 2000;
    }
    #bouton-explorer-etoiles.visible {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body style="margin:0;">
  <div id="entete-controles"></div>
  <div id="graphic" class="zone-scene">
    <div id="titre-scene" class="titre-scene">
      <div class="eyebrow" id="titre-compteur"></div>
      <h2 id="titre-texte" aria-live="polite"></h2>
    </div>
    <div id="phrase-progressive" class="phrase-progressive"></div>
    <div id="sous-titre-rupture" class="sous-titre-rupture"></div>
    <div id="carte-valeur" class="carte-valeur">
      <div class="carte-valeur-autochtone"></div>
      <div class="carte-valeur-traduction"></div>
      <div class="carte-valeur-definition"></div>
    </div>
    <!-- Mot permanent du step D (Ishpenitamun / Respect) : même position que
         #carte-valeur, visible tant qu'aucun cercle n'est survolé, recouvert
         par la carte au survol (voir avantColonisation.js). -->
    <div id="mot-permanent-valeur" class="mot-permanent-valeur">
      <div class="carte-valeur-autochtone"></div>
      <div class="carte-valeur-traduction"></div>
      <button id="bouton-audio-respect" class="bouton-audio-respect" type="button" aria-label="">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" fill="#fff"/>
        </svg>
      </button>
    </div>
  </div>
  <div id="texteStep" class="texte-step-narratif"></div>

  <!-- Sobre par choix : pas d'animation d'entrée tapageuse, cohérent avec la demande "bouton sobre" -->
  <a id="bouton-explorer-etoiles" href="../univers/index.html"></a>

  <div id="zone-timeline" class="zone-timeline">
    <div class="zone-rail">
      <div class="controles-gauche">
        <button id="btn-recule" aria-label="Step précédent">◀</button>
        <button id="btn-avance" aria-label="Step suivant">▶</button>
      </div>
      <div class="rail-wrapper">
        <div id="rail" class="rail"><!-- construit dynamiquement par timelineRail.js --></div>
      </div>
    </div>
  </div>

  <div id="rail-parcours" class="rail-parcours"><!-- construit dynamiquement par shared/js/railParcours.js --></div>

  <script type="module">
    import { initI18n } from "../shared/js/i18n.js";
    import { langueSauvegardee } from "../shared/js/preferences.js";
    import { initHeaderControls } from "../shared/js/headerControls.js";
    import { init } from "./js/script.js";

    await initI18n(langueSauvegardee() || 'fr');
    initHeaderControls(document.getElementById("entete-controles"));
    init();
  </script>
</body>
</html>
